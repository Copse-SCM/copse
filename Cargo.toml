[package]
name = "copse"
version = "2026.11.0"
edition = "2021"
description = "A fast version control system that works with git servers, with undo for everything and a built-in terminal interface"
license = "Apache-2.0"
repository = "https://github.com/Copse-SCM/copse"
homepage = "https://github.com/Copse-SCM/copse"
readme = "README.md"
keywords = ["git", "vcs", "version-control", "tui"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
ignore = "0.4"
libc = "0.2"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
sha2 = "0.11"
serde_json = "1"
similar = "3"
ratatui = "0.30"
ureq = "3"
zstd = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
