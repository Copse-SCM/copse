[package]
name = "copse"
version = "0.1.0"
edition = "2021"
description = "A small, fast, personal version control system"

[dependencies]
anyhow = "1"
bincode = "3.0"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
ignore = "0.4"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
sha2 = "0.11"
serde_json = "1"
similar = "3"
ratatui = "0.30"
ureq = "3"
zstd = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
