# Build copse and run every test on macOS and Linux, for each push and pull request.
name: CI

on:
  push:
  pull_request:

# The token CI gets can read the code and nothing else.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Actions are pinned to exact commits (Dependabot proposes updates).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Test suites (git is the oracle wherever possible)
        run: tests/run-all.sh --check-docs "$RUNNER_TEMP/copse-tests"

      - name: Randomized stress test against git
        run: python3 tests/fuzz.py 150 1 "$RUNNER_TEMP/copse-fuzz"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      - name: Known vulnerabilities in dependencies (RustSec)
        run: cargo audit
