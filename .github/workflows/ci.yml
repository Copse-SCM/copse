# Build copse and run every test on macOS and Linux, for each push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Test suites (git is the oracle wherever possible)
        run: tests/run-all.sh --check-docs "$RUNNER_TEMP/copse-tests"

      - name: Randomized stress test against git
        run: python3 tests/fuzz.py 150 1 "$RUNNER_TEMP/copse-fuzz"
