# Pushing a version tag (vYEAR.MONTH.N, e.g. v2026.11.0) builds copse for every
# platform and publishes a GitHub release with the archives and their checksums.
# The tag must match the version in Cargo.toml.
#
# Run it by hand from the Actions tab for a dry run: everything happens the same
# way, but the release is a draft (only the repository's admins can see it) named
# "dry-run", and the Homebrew formula is printed instead of pushed to the tap.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: The tag matches Cargo.toml
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "A dry run of the release of $cargo."
            { echo "version=$cargo"; echo "tag=dry-run"; echo "dry_run=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "::error::release tags look like v2026.11.0 (year.month.release), not $GITHUB_REF_NAME"; exit 1
          fi
          if [ "$tag" != "$cargo" ]; then
            echo "::error::the tag says $tag but Cargo.toml says $cargo"; exit 1
          fi
          { echo "version=$tag"; echo "tag=$GITHUB_REF_NAME"; echo "dry_run=false"; } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum copse-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        run: |
          if [ "$DRY_RUN" = true ]; then
            gh release delete dry-run --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            gh release create dry-run dist/* --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "copse $VERSION (dry run)" --notes "A dry run of the release workflow; not a release. Safe to delete."
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "copse $VERSION" --generate-notes
          fi

  # Point the Homebrew tap (Copse-SCM/homebrew-copse) at the new release. Writing to
  # another repository needs a token: a fine-grained one, for that repository only,
  # with "Contents: read and write", saved as the HOMEBREW_TAP_TOKEN secret. Without
  # it this job just says so, and the formula can be updated by hand with render.py.
  homebrew:
    needs: [version, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: No token, no update
        if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN isn't set, so the Homebrew tap wasn't updated. Update it with packaging/homebrew/render.py."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.TAP_TOKEN != ''
        with:
          persist-credentials: false

      - name: Update the formula
        if: env.TAP_TOKEN != ''
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: this is the formula a release would push to the tap:"
            python3 packaging/homebrew/render.py "$VERSION" "v$VERSION" SHA256SUMS
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Copse-SCM/homebrew-copse.git" tap
          mkdir -p tap/Formula
          python3 packaging/homebrew/render.py "$VERSION" "v$VERSION" SHA256SUMS > tap/Formula/copse.rb
          cd tap
          git config user.name "Belligerently"
          git config user.email "zachary@aflalo.com"
          git add Formula/copse.rb
          git diff --cached --quiet && { echo "The formula is already up to date."; exit 0; }
          git commit -m "copse $VERSION"
          git push origin HEAD
