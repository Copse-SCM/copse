# Once a day, if main changed since the last one, build copse for every platform and
# publish it as the "nightly" pre-release (replacing the previous one). Versions look
# like 2026.11.09-dev+abc1234: the build date and the commit. Run it by hand from the
# Actions tab to get one now.
name: Nightly

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      version: ${{ steps.c.outputs.version }}
      sha: ${{ steps.c.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: c
        name: Has main changed since the last nightly?
        run: |
          sha=$(git rev-parse HEAD)
          last=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | grep -o 'commit [0-9a-f]\{40\}' | cut -d' ' -f2 || true)
          if [ "$sha" = "$last" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "Nothing new since the last nightly ($sha)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y.%m.%d)-dev+${sha:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.check.outputs.version }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to replace the nightly pre-release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      SHA: ${{ needs.check.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum copse-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Replace the nightly pre-release
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly dist/* --repo "$GITHUB_REPOSITORY" --prerelease --target "$SHA" \
            --title "copse nightly $VERSION" \
            --notes "A development build of copse from commit $SHA, made $(date -u '+%Y-%m-%d %H:%M UTC'). It has everything on main so far and may have rough edges; for everyday use, take the latest release."
