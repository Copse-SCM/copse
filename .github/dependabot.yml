# Keep dependencies current: Rust crates and the GitHub Actions CI uses (which are
# pinned to exact commits, so updates arrive as reviewed pull requests).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates together; each major upgrade (which may change
      # code or formats, like bincode's) gets a pull request of its own.
      crates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
